app = "fumblebee-spacetime"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile.spacetime"

[mounts]
  source = "spacetime_data"
  destination = "/root/.spacetime"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
